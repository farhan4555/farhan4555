<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HALO Motion Ad</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; height: 100%; }
  #gl { display: block; width: 1920px; height: 1080px; }
  body.live #gl { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; position: absolute; inset: 0; }
  body.live.vert #gl { width: 56.25vh; height: 100vh; max-width: 100vw; max-height: 177.78vw; }
  #play { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #eee;
          font: 600 18px "Inter", system-ui, sans-serif; letter-spacing: .3em; cursor: pointer; background: rgba(0,0,0,.55); }
  body.live #play { display: flex; }
</style>
</head>
<body>
<canvas id="gl" width="1920" height="1080"></canvas>
<div id="play">▶&nbsp;&nbsp;PLAY WITH SOUND</div>
<script>
'use strict';
/* =====================================================================
   HALO — a 30s motion-graphics spot for a fictional smart ring.
   Everything is a pure function of time t (seconds) → deterministic
   frame-by-frame rendering. renderFrame(t) is the only entry point.
   ===================================================================== */
// ?vertical → 1080×1920 (9:16) cut with its own layouts; default is 1920×1080.
const VERT = /vertical/.test(location.search);
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080, DUR = 30;
// Same pixels-per-world-unit in both formats: the 9:16 frame is as wide as the 16:9 frame is tall.
const CAMZ = 5, FPX = 540 / Math.tan(15 * Math.PI / 180), TANF = (H / 2) / FPX;
const L = (land, vert) => VERT ? vert : land;   // pick a layout value per format
const M = L(120, 80);                            // side margin
// ring placement while the feature panels are on screen
const FP = L({ x: -1.08, y: -.02, s: .78 }, { x: 0, y: 1.08, s: .6 });

/* ---------- math / easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const mixA = (a, b, x) => a.map((v, i) => v + (b[i] - v) * x);
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eInOutExpo = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInCubic = x => x * x * x;
const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const gauss = (x, s) => Math.exp(-x * x / (2 * s * s));
const hex = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
const rgba = (c, a = 1) => `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a})`;
const DEG = Math.PI / 180;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// impulse train: sum of decaying spikes after each event time
const impulses = (t, list, k) => list.reduce((s, e) => s + (t >= e ? Math.exp(-(t - e) * k) : 0), 0);

/* ---------- palette ---------- */
const C = {
  ink: hex('#050508'), paper: hex('#F3EFE8'), pulse: hex('#FF3D5A'), amber: hex('#FFB86B'),
  violet: hex('#8A7CFF'), mint: hex('#3DFFB0'), warm: hex('#FFD9B0'), grey: hex('#8E8A93'),
};
const TITANIUM = [0.80, 0.80, 0.83];

/* ---------- 2D layers: UNDER (behind ring) and OVER (in front) ---------- */
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const UC = mk(), OC = mk();
const u = UC.getContext('2d'), o = OC.getContext('2d');

/* ---------- text helpers ---------- */
function setFont(c, size, weight = 800, fam = 'Inter Display', track = 0) {
  c.font = `${weight} ${size}px "${fam}"`;
  c.letterSpacing = (track * size).toFixed(2) + 'px';
  c.textBaseline = 'alphabetic'; c.textAlign = 'left';
}
function textWidth(c, str, size, track) { return c.measureText(str).width - track * size; }

// Per-character masked reveal (chars rise from below a clip line) + optional exit.
function reveal(c, str, x, y, op) {
  const { size = 100, weight = 800, fam = 'Inter Display', color = '#fff', align = 'center', track = 0,
    lt = 1, dur = .7, stagger = .03, out = -1, outDur = .35, alpha = 1, clip = true, ghost = true } = op;
  c.save();
  setFont(c, size, weight, fam, track);
  const full = textWidth(c, str, size, track);
  const x0 = align === 'center' ? x - full / 2 : align === 'right' ? x - full : x;
  if (clip) { c.beginPath(); c.rect(x0 - size, y - size * 1.02, full + size * 2, size * 1.32); c.clip(); }
  c.fillStyle = color;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i]; if (ch === ' ') continue;
    const px = x0 + c.measureText(str.slice(0, i)).width;
    const p = eOutExpo(clamp((lt - i * stagger) / dur));
    let dy = (1 - p) * size * 1.05, a = Math.min(1, p * 1.6);
    if (out >= 0) { const q = eInCubic(clamp((out - i * stagger * .6) / outDur)); dy -= q * size * 1.05; a *= 1 - q; }
    if (a <= .002) continue;
    // cheap vertical motion blur: ghost copies along the travel direction
    const v = Math.abs(dy) / size;
    if (ghost && v > .03) {
      for (let g = 1; g <= 5; g++) { c.globalAlpha = alpha * a * .1; c.fillText(ch, px, y + dy + Math.sign(dy) * g * size * .022 * Math.min(1, v * 3)); }
    }
    c.globalAlpha = alpha * a;
    c.fillText(ch, px, y + dy);
  }
  c.restore();
  return full;
}
function label(c, str, x, y, size, color, op = {}) {
  const { weight = 500, fam = 'Inter', track = .28, align = 'left', alpha = 1 } = op;
  c.save(); setFont(c, size, weight, fam, track);
  const w = textWidth(c, str, size, track);
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  c.globalAlpha = alpha; c.fillStyle = color; c.fillText(str, x0, y); c.restore(); return w;
}
function fitSize(c, str, size, weight, track, maxW) {
  setFont(c, size, weight, 'Inter Display', track);
  const w = textWidth(c, str, size, track); return w > maxW ? size * maxW / w : size;
}

/* ---------- ring transform & projection (mirrors the shader) ---------- */
function rotMat(rx, ry, rz) { // world-from-local, row-major, R = Rz * Rx * Ry
  const [cx, sx, cy, sy, cz, sz] = [Math.cos(rx), Math.sin(rx), Math.cos(ry), Math.sin(ry), Math.cos(rz), Math.sin(rz)];
  const Rx = [1, 0, 0, 0, cx, -sx, 0, sx, cx], Ry = [cy, 0, sy, 0, 1, 0, -sy, 0, cy], Rz = [cz, -sz, 0, sz, cz, 0, 0, 0, 1];
  const mul = (A, B) => { const M = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) M[i * 3 + j] = A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j]; return M; };
  return mul(Rz, mul(Rx, Ry));
}
const apply = (M, v) => [M[0] * v[0] + M[1] * v[1] + M[2] * v[2], M[3] * v[0] + M[4] * v[1] + M[5] * v[2], M[6] * v[0] + M[7] * v[1] + M[8] * v[2]];
function project(p) { const k = FPX / (CAMZ - p[2]); return [W / 2 + p[0] * k, H / 2 - p[1] * k, k / (FPX / CAMZ)]; }
function ringPoint(R, M, theta, rad, y = 0) {
  const l = apply(M, [rad * Math.cos(theta) * R.s, y * R.s, rad * Math.sin(theta) * R.s]);
  return [R.x + l[0], R.y + l[1], R.z + l[2]];
}

// Text wrapped around the ring in 3D: back half drawn UNDER the ring, front half OVER it.
function orbitText(R, str, rad, rot, op) {
  const { size = 30, color = '#fff', alpha = 1, weight = 600, track = 0, yOff = 0 } = op;
  const M = rotMat(R.rx, R.ry, R.rz);
  const n = str.length, step = Math.PI * 2 / n;
  for (const c of [u, o]) { setFont(c, size, weight, 'Inter', track); c.fillStyle = color; }
  for (let i = 0; i < n; i++) {
    const ch = str[i]; if (ch === ' ') continue;
    const th = rot - i * step;
    const wp = ringPoint(R, M, th, rad, yOff), wn = ringPoint(R, M, th - .01, rad, yOff);
    const a = project(wp), b = project(wn);
    const front = wp[2] > R.z;
    const c = front ? o : u;
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const depth = (wp[2] - R.z) / (rad * R.s);           // -1 back … +1 front
    c.save(); c.translate(a[0], a[1]); c.rotate(ang);
    const sc = a[2];
    c.scale(sc, front ? sc : -sc);                          // back half reads mirrored, like real 3D type
    c.globalAlpha = alpha * (front ? lerp(.55, 1, depth) : lerp(.35, .12, -depth));
    const w = c.measureText(ch).width;
    c.fillText(ch, -w / 2, size * .36);
    c.restore();
  }
}

/* ---------- ECG ---------- */
function qrs(d) {
  return .09 * gauss(d + .14, .028) - .14 * gauss(d + .028, .009) + 1.0 * gauss(d, .011)
    - .32 * gauss(d - .024, .01) + .2 * gauss(d - .25, .05);
}
const HB = [0.55, 1.55, 2.55, 3.4];
const ecgOpen = tau => HB.reduce((s, b) => s + qrs(tau - b), 0);
const ecgLoop = (tau, per) => { const f = ((tau % per) + per) % per; return qrs(f - per * .45); };

/* ---------- particles for the collapse ---------- */
const PARTS = (() => { const r = rng(7), a = []; for (let i = 0; i < 900; i++) a.push({ a: r() * 6.283, r: 260 + Math.pow(r(), .7) * 1150, sp: .5 + r(), sz: .8 + r() * 2.4, hot: r() < .3, z: r() }); return a; })();

/* ---------- scene state ---------- */
function freshState() {
  return {
    bgA: [.04, .04, .06], bgB: [.008, .008, .012], bgC: [.5, .5],
    ring: { vis: 0, x: 0, y: 0, z: 0, s: 1, rx: 70 * DEG, ry: 0, rz: -18 * DEG, metal: TITANIUM.slice(), glowCol: C.pulse.slice(), glow: .6, halo: .5, env: 0 },
    post: { ca: .12, grain: .05, vig: .6, flash: [1, 1, 1, 0], fade: 0, bloom: .55, overGlow: .22 },
    shake: [0, 0],
  };
}

/* =====================================================================
   SCENES
   ===================================================================== */

// 0 – 4s · heartbeat cold open
function sceneOpen(t, S) {
  if (t >= 4) return;
  S.bgA = [.045, .035, .05]; S.bgB = [.006, .005, .008];
  const cx = W / 2, cy = H / 2 - 40, speed = 560;
  // monitor grid
  u.save(); u.strokeStyle = 'rgba(255,255,255,0.035)'; u.lineWidth = 1;
  const gp = P(t, 0, .8);
  for (let x = (cx % 60); x < W; x += 60) { u.globalAlpha = gp; u.beginPath(); u.moveTo(x, 0); u.lineTo(x, H); u.stroke(); }
  for (let y = (cy % 60); y < H; y += 60) { u.globalAlpha = gp; u.beginPath(); u.moveTo(0, y); u.lineTo(W, y); u.stroke(); }
  u.restore();

  const collapse = P(t, 3.55, 4.0);
  const lineA = 1 - eInCubic(P(t, 3.5, 3.8));
  // ECG trace scrolling into a fixed head
  o.save();
  const grad = o.createLinearGradient(cx - L(1000, 600), 0, cx, 0);
  grad.addColorStop(0, rgba(C.pulse, 0)); grad.addColorStop(.7, rgba(C.pulse, .6)); grad.addColorStop(1, rgba(C.pulse, 1));
  o.strokeStyle = grad; o.lineWidth = 3.2; o.lineJoin = 'round'; o.globalAlpha = lineA * P(t, .1, .5);
  o.shadowColor = rgba(C.pulse, .9); o.shadowBlur = 18;
  o.beginPath();
  for (let x = cx - L(1000, 600); x <= cx; x += 2) {
    const tau = t - (cx - x) / speed; const y = cy - (tau < 0 ? 0 : ecgOpen(tau)) * 190;
    x === cx - L(1000, 600) ? o.moveTo(x, y) : o.lineTo(x, y);
  }
  o.stroke(); o.restore();
  // ripples on each beat
  for (const b of HB) {
    const d = t - b; if (d < 0 || d > 1.6) continue;
    const p = eOutExpo(d / 1.6);
    o.save(); o.globalAlpha = (1 - d / 1.6) * .55 * lineA; o.strokeStyle = rgba(C.pulse); o.lineWidth = 2;
    o.beginPath(); o.arc(cx, cy - ecgOpen(t) * 190, 14 + p * 520, 0, 7); o.stroke(); o.restore();
  }
  // head dot → swells into the white of the next scene
  const hy = cy - ecgOpen(t) * 190 * (1 - collapse);
  const beat = impulses(t, HB, 7);
  const r = 7 + beat * 8 + eInExpo(collapse) * L(1300, 1500);
  o.save();
  o.shadowColor = rgba(C.pulse); o.shadowBlur = 40 * (1 - collapse);
  o.fillStyle = rgba(mixA(C.paper, C.paper, 0)); o.globalAlpha = P(t, .1, .4);
  o.beginPath(); o.arc(cx, lerp(hy, H / 2, eInCubic(collapse)), r, 0, 7); o.fill(); o.restore();

  // copy
  const ty = H / 2 + 250;
  reveal(o, 'Your body never stops talking.', cx, ty, { size: L(50, 52), weight: 500, color: '#EDEAE4', lt: t - .75, dur: .8, stagger: .018, out: t - 2.25, track: -.01 });
  reveal(o, 'Are you listening?', cx, ty, { size: L(50, 52), weight: 500, color: '#EDEAE4', lt: t - 2.6, dur: .7, stagger: .022, out: t - 3.45, track: -.01 });
  label(o, 'BPM  ' + (t < .55 ? '--' : '61'), L(140, M), L(140, 270), 18, 'rgba(255,61,90,0.9)', { alpha: P(t, .3, .7) * lineA });
  label(o, 'REC ●', W - L(140, M), L(140, 270), 18, 'rgba(237,234,228,0.6)', { align: 'right', alpha: P(t, .3, .7) * lineA * (Math.floor(t * 2) % 2 ? 1 : .35) });
  S.post.fade = 1 - P(t, 0, .35);
}

// 4 – 8s · kinetic word hits, then a vortex of type collapses into the ring
const WORDS = [
  { w: 'SLEEP.', bg: '#F3EFE8', fg: '#0A0A0D' },
  { w: 'STRESS.', bg: '#050508', fg: '#FF3D5A' },
  { w: 'RECOVERY.', bg: '#FF3D5A', fg: '#0A0A0D' },
  { w: 'HEART.', bg: '#050508', fg: '#F3EFE8' },
];
function sceneWords(t, S) {
  if (t < 4 || t >= 8) return;
  if (t < 6) {
    const i = Math.min(3, Math.floor((t - 4) / .5)), Wd = WORDS[i], lt = t - 4 - i * .5;
    S.bgA = hex(Wd.bg); S.bgB = mixA(hex(Wd.bg), [0, 0, 0], .18); S.post.vig = .25; S.post.grain = .06; S.post.bloom = 0; S.post.overGlow = 0;
    const sz = fitSize(o, Wd.w, 330, 800, -.035, W - L(280, 110));
    const punch = 1 + .14 * (1 - eOutExpo(lt / .45));
    o.save(); o.translate(W / 2, H / 2); o.scale(punch, punch); o.translate(-W / 2, -H / 2);
    reveal(o, Wd.w, W / 2, H / 2 + sz * .36, { size: sz, weight: 800, color: Wd.fg, lt, dur: .32, stagger: .022, track: -.035 });
    o.restore();
    const fgc = Wd.fg;
    label(o, `0${i + 1} / 04`, M, L(120, 270), 20, fgc, { weight: 600, alpha: .8 });
    label(o, 'SIGNALS', W - M, L(120, 270), 20, fgc, { weight: 600, align: 'right', alpha: .8 });
    label(o, ['Every night', 'Every meeting', 'Every rep', 'Every beat'][i], M, H - L(110, 360), 20, fgc, { weight: 500, alpha: .7, track: .12 });
    // tick marks along the bottom (progress)
    o.save(); o.fillStyle = fgc; for (let k = 0; k < 4; k++) { o.globalAlpha = k <= i ? .9 : .2; o.fillRect(W - M - (3 - k) * 46 - 36, H - L(122, 372), 36, 4); } o.restore();
    return;
  }
  // 6 – 8 vortex
  const lt = t - 6;
  S.bgA = [.07, .05, .07]; S.bgB = [.006, .005, .008]; S.post.vig = .7;
  const coll = eInExpo(P(t, 7.45, 8.0));
  const R0 = 400;
  const R = lerp(1500, R0, eOutExpo(P(lt, 0, .9))) * (1 - coll * .985);
  const spin = lt * .35 + eInExpo(P(t, 6.9, 8.0)) * 5;
  const ring = (str, rad, rot, size, col, alpha, weight = 700) => {
    o.save(); setFont(o, size, weight, 'Inter', .22); o.fillStyle = col;
    const base = str; let s = base; const unit = o.measureText(base).width;
    const reps = Math.max(1, Math.round(2 * Math.PI * rad / unit)); s = base.repeat(reps);
    const total = o.measureText(s).width; let acc = 0;
    const sc = R / R0;
    for (let k = 0; k < s.length; k++) {
      const cw = o.measureText(s[k]).width;
      const a = rot + (acc + cw / 2) / total * Math.PI * 2; acc += cw;
      if (s[k] === ' ') continue;
      o.save(); o.translate(W / 2 + Math.cos(a) * rad * sc, H / 2 + Math.sin(a) * rad * sc); o.rotate(a + Math.PI / 2); o.scale(sc, sc);
      o.globalAlpha = alpha; o.fillText(s[k], -cw / 2, 0); o.restore();
    }
    o.restore();
  };
  const ia = P(lt, 0, .3) * (1 - coll);
  ring('SLEEP · STRESS · RECOVERY · HEART · READINESS · TEMPERATURE · ', R0, spin, 34, '#EDEAE4', ia * .9);
  ring('24/7 · ', R0 * .8, -spin * 1.3 + 1, 20, rgba(C.pulse), ia * .8, 600);
  ring('● ', R0 * 1.18, spin * .6, 10, 'rgba(237,234,228,0.5)', ia, 600);
  reveal(o, 'All of it.', W / 2, H / 2 + 34, { size: L(96, 76), weight: 700, color: '#F3EFE8', lt: lt - .2, dur: .6, stagger: .03, out: lt - .85, track: -.03 });
  reveal(o, 'On one finger.', W / 2, H / 2 + 34, { size: L(96, 76), weight: 700, color: '#F3EFE8', lt: lt - .95, dur: .6, stagger: .025, out: lt - 1.5, track: -.03 });
  // particles spiral inward, leaving streaks
  const pp = P(t, 6.55, 8.0);
  if (pp > 0) {
    o.save(); o.globalCompositeOperation = 'lighter'; o.lineCap = 'round';
    const pos = (q, tt) => { const pr = P(tt, 6.55, 8.0); const r = q.r * (1 - eInCubic(pr) * .995); const a = q.a + (tt - 6.55) * q.sp * .7 + eInExpo(pr) * 7 * q.sp; return [W / 2 + Math.cos(a) * r, H / 2 + Math.sin(a) * r * .92]; };
    for (const q of PARTS) {
      const a = pos(q, t), b = pos(q, t - .045);
      o.globalAlpha = P(t, 6.55, 6.9) * (.35 + q.z * .65);
      o.strokeStyle = q.hot ? rgba(C.pulse) : '#F3EFE8'; o.lineWidth = q.sz;
      o.beginPath(); o.moveTo(b[0], b[1]); o.lineTo(a[0] + .01, a[1]); o.stroke();
    }
    // core glow
    const g = o.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 260);
    g.addColorStop(0, rgba(C.pulse, .9 * coll + .15 * pp)); g.addColorStop(1, rgba(C.pulse, 0));
    o.globalAlpha = 1; o.fillStyle = g; o.fillRect(0, 0, W, H);
    o.restore();
  }
}

// 8 – 12s · reveal
function sceneReveal(t, S) {
  if (t < 8 || t >= 12.2) return;
  const lt = t - 8, R = S.ring;
  S.bgA = [.10, .06, .07]; S.bgB = [.006, .005, .008]; S.bgC = [.5, .52];
  const grow = eOutExpo(P(lt, 0, 1.6));
  R.vis = P(lt, 0, .15);
  R.s = lerp(.3, .8, grow);
  R.rx = lerp(8 * DEG, 68 * DEG, eOutCubic(P(lt, 0, 2.2)));
  R.rz = lerp(25 * DEG, -16 * DEG, eOutCubic(P(lt, 0, 2.4)));
  R.ry = -lt * .55 - (1 - grow) * 6;
  R.halo = lerp(2.2, .7, eOutCubic(P(lt, 0, 1.5)));
  R.glow = .7 + .5 * impulses(t, [8, 9, 10, 11], 4);
  R.env = lt * .25;
  // move left for the feature section
  const mv = eInOutCubic(P(t, 11.2, 12.2));
  R.x = lerp(0, FP.x, mv); R.s = lerp(R.s, FP.s, mv); R.y = lerp(0, FP.y, mv);

  // giant wordmark behind the ring
  const out = eInCubic(P(t, 10.9, 11.5));
  u.save();
  const track = lerp(.6, .1, eOutExpo(P(lt, .7, 2.4)));
  setFont(u, 520, 800, 'Inter Display', track);
  const word = 'HALO'; const ww = textWidth(u, word, 520, track);
  const gx = u.createLinearGradient(0, H / 2 - 260, 0, H / 2 + 200);
  gx.addColorStop(0, 'rgba(255,255,255,0.22)'); gx.addColorStop(1, 'rgba(255,255,255,0.03)');
  u.restore();
  const wm = { size: 520, weight: 800, color: gx, dur: 1.1, stagger: .07, track, alpha: 1 - out, clip: false, ghost: false };
  if (!VERT) reveal(u, word, W / 2, H / 2 + 190, { ...wm, lt: lt - .8 });
  else {  // stacked HA / LO fills the tall frame behind the ring
    reveal(u, 'HA', W / 2, H / 2 - 40, { ...wm, lt: lt - .8, color: '#ffffff', alpha: .16 * (1 - out) });
    reveal(u, 'LO', W / 2, H / 2 + 430, { ...wm, lt: lt - .94, color: '#ffffff', alpha: .07 * (1 - out) });
  }
  // 3D orbiting type

/* =====================================================================
   WEBGL: ring raymarcher + composite (bloom, chromatic aberration, grain)
   ===================================================================== */
const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;

const FS_SCENE = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform mat3 uRot; uniform vec3 uPos; uniform float uScale;
uniform vec3 uMetal, uGlowCol; uniform float uGlow, uHalo, uVis, uEnv;
uniform vec3 uBgA, uBgB; uniform vec2 uBgC; uniform sampler2D uUnder;

const float FOV = ${TANF.toFixed(6)};

float sdRing(vec3 p){
  vec2 q = vec2(length(p.xz) - 1.0, p.y);
  vec2 b = vec2(0.078, 0.27); float r = 0.065;
  vec2 d2 = abs(q) - b + r;
  float d = length(max(d2, 0.0)) + min(max(d2.x, d2.y), 0.0) - r;
  float g = length(vec2(q.x - 0.078, abs(q.y) - 0.165)) - 0.012;   // two machined grooves
  d = max(d, -g);
  // sensor bumps on the inner face
  float a = atan(p.z, p.x);
  float sa = mod(a + 0.21, 0.42) - 0.21;
  float bump = length(vec3(q.x + 0.078, abs(q.y) - 0.0, sa * 0.93)) - 0.038;
  if (abs(a - 1.5708) < 0.5) d = min(d, bump);
  return d;
}
float map(vec3 p){ return sdRing(uRot * (p - uPos) / uScale) * uScale; }
vec3 nrm(vec3 p){ vec2 e = vec2(0.0007, -0.0007);
  return normalize(e.xyy*map(p+e.xyy) + e.yyx*map(p+e.yyx) + e.yxy*map(p+e.yxy) + e.xxx*map(p+e.xxx)); }

vec3 env(vec3 d){
  float c = cos(uEnv), s = sin(uEnv);
  d.xz = mat2(c, -s, s, c) * d.xz;
  float az = atan(d.x, d.z);
  vec3 col = mix(vec3(0.012,0.011,0.015), vec3(0.06,0.058,0.065), smoothstep(-0.6, 0.9, d.y));
  col += vec3(1.0,0.97,0.93) * 3.2 * smoothstep(0.80, 0.93, dot(d, normalize(vec3(0.2, 0.75, 0.6))));   // top softbox
  col += vec3(1.0) * 2.4 * smoothstep(0.10, 0.0, abs(az + 1.25)) * smoothstep(0.75, 0.3, abs(d.y));      // left strip
  col += vec3(1.0,0.92,0.85) * 1.4 * smoothstep(0.07, 0.0, abs(az - 1.9)) * smoothstep(0.8, 0.2, abs(d.y - 0.1)); // right strip
  col += uGlowCol * 1.3 * smoothstep(0.2, 0.95, -d.z) * smoothstep(-0.4, 0.4, -d.y);                     // coloured rim from behind
  col += vec3(0.9) * 0.6 * smoothstep(0.85, 1.0, dot(d, normalize(vec3(-0.5, -0.2, 0.84))));             // small fill kicker

}
vec3 shade(vec3 p, vec3 rd){
  vec3 n = nrm(p);

  n = normalize(n + 0.025 * vec3(sin(lp.y * 900.0 + ang * 3.0), 0.0, cos(lp.y * 700.0)) * 0.5);
  vec3 r = reflect(rd, n);
  float ndv = max(dot(n, -rd), 0.0);
  vec3 F = uMetal + (1.0 - uMetal) * pow(1.0 - ndv, 5.0);
  vec3 col = F * (env(r) * 0.75 + env(normalize(r + n * 0.12)) * 0.25);
  col += uMetal * 0.03 * (0.5 + 0.5 * n.y);
  // cheap AO
  float ao = 0.0, sc = 1.0;
  for (int i = 1; i <= 4; i++){ float h = 0.02 * float(i); ao += (h - map(p + n * h)) * sc; sc *= 0.6; }
  col *= clamp(1.0 - 6.0 * ao / uScale, 0.25, 1.0);
  // inner emissive sensor band
  float rr = length(lp.xz) - 1.0;
  float inner = smoothstep(-0.05, -0.085, rr);
  float band = smoothstep(0.24, 0.05, abs(lp.y));
  float sens = smoothstep(0.045, 0.0, abs(lp.y)) * smoothstep(0.6, 0.0, abs(ang - 1.5708));
  col += uGlowCol * uGlow * inner * (band * 0.35 + sens * 2.5);
  return col;
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float rr = length((uv - uBgC) * vec2(uRes.x / uRes.y, 1.0));
  vec3 bg = mix(uBgA, uBgB, smoothstep(0.0, 1.15, rr));
  vec4 under = texture(uUnder, uv);
  vec3 col = bg * (1.0 - under.a) + under.rgb;

  if (uVis > 0.001){
    vec3 ro = vec3(0.0, 0.0, ${CAMZ.toFixed(1)});
    vec3 rd = normalize(vec3(p * 2.0 * FOV, -1.0));
    vec3 oc = ro - uPos; float rad = 2.1 * uScale;
    float b = dot(oc, rd), c = dot(oc, oc) - rad * rad, h = b * b - c;
    if (h > 0.0){
      h = sqrt(h);
      float t = max(-b - h, 0.0), t1 = -b + h;
      float pxk = 2.0 * FOV / uRes.y;
      float best = 1e9, bestT = t, halo = 0.0; bool hit = false;
      for (int i = 0; i < 120; i++){
        vec3 pos = ro + rd * t; float d = map(pos);
        halo += exp(-d * 7.0 / uScale) * clamp(d, 0.003, 0.08) / uScale;
        float ratio = d / (pxk * t);
        if (ratio < best){ best = ratio; bestT = t; }
        if (d < 0.0003 * t){ hit = true; break; }
        t += d * 0.92;
        if (t > t1) break;
      }
      float cov = hit ? 1.0 : clamp(1.0 - best, 0.0, 1.0);
      if (cov > 0.0){
        vec3 rc = aces(shade(ro + rd * (hit ? t : bestT), rd) * 1.1);
        col = mix(col, rc, cov * uVis);
      }
      col += uGlowCol * halo * 0.22 * uHalo * uVis * (1.0 - cov * 0.6);
    }
  }
  frag = vec4(col, 1.0);
}`;

const FS_POST = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform sampler2D uScene, uOver;
uniform float uCA, uGrain, uVig, uFade, uBloom, uOverGlow, uSeed; uniform vec4 uFlash;
out vec4 frag;
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32 + uSeed); return fract(p.x * p.y); }
vec3 comp(vec2 uv){ vec4 o = texture(uOver, uv); return texture(uScene, uv).rgb * (1.0 - o.a) + o.rgb; }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 dir = uv - 0.5;
  vec2 off = dir * uCA * 0.014 * (0.3 + length(dir));
  vec3 col = vec3(comp(uv + off).r, comp(uv).g, comp(uv - off).b);
  vec3 bl = textureLod(uScene, uv, 3.0).rgb * 0.35 + textureLod(uScene, uv, 5.0).rgb * 0.4 + textureLod(uScene, uv, 7.0).rgb * 0.5;
  col += max(bl - 0.32, 0.0) * max(bl - 0.32, 0.0) * uBloom * 2.6;
  vec3 ob = textureLod(uOver, uv, 4.0).rgb * 0.5 + textureLod(uOver, uv, 6.0).rgb * 0.6;
  col += max(ob - 0.08, 0.0) * uOverGlow;
  float v = smoothstep(1.25, 0.25, length(dir * vec2(1.0, 0.78)) * 1.5);
  col *= mix(1.0, v, uVig);
  col = mix(col, uFlash.rgb, clamp(uFlash.a, 0.0, 1.0));
  float g = hash(gl_FragCoord.xy) + hash(gl_FragCoord.xy + 17.0) - 1.0;
  col += g * uGrain * (0.6 + 0.4 * (1.0 - dot(col, vec3(0.333))));
  col *= 1.0 - uFade;
  frag = vec4(col, 1.0);
}`;

const cv = document.getElementById('gl');
cv.width = W; cv.height = H; cv.style.width = W + 'px'; cv.style.height = H + 'px';
if (VERT) document.body.classList.add('vert');
const gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function program(fs) {
  const p = gl.createProgram(); gl.attachShader(p, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const cache = {}; p.u = n => (n in cache ? cache[n] : (cache[n] = gl.getUniformLocation(p, n))); return p;
}
const PS = program(FS_SCENE), PP = program(FS_POST);
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
function texture(mips) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
const texUnder = texture(false), texOver = texture(true), texScene = texture(true);
gl.bindTexture(gl.TEXTURE_2D, texScene); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texScene, 0);
gl.bindFramebuffer(gl.FRAMEBUFFER, null);
function upload(tex, canvas, mips) {
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
  if (mips) gl.generateMipmap(gl.TEXTURE_2D);
}

/* =====================================================================
   FRAME
   ===================================================================== */
const HITS = [4, 4.5, 5, 5.5, 8, 20, 21, 22, 23, 24];
function renderFrame(t) {
  const S = freshState();
  for (const c of [u, o]) { c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.shadowBlur = 0; c.filter = 'none'; }
  // impact camera shake
  const sh = 14 * impulses(t, [4], 9) + 22 * impulses(t, [8], 6) + 10 * impulses(t, [20, 21, 22, 23], 10) + 16 * impulses(t, [24], 7);
  const sx = Math.sin(t * 91.7) * sh, sy = Math.cos(t * 73.3) * sh;
  for (const c of [u, o]) c.setTransform(1, 0, 0, 1, sx, sy);

  sceneOpen(t, S); sceneWords(t, S); sceneReveal(t, S); sceneFeatures(t, S); sceneColors(t, S); sceneEnd(t, S);

  // Touch both layers every frame so the browser never hands WebGL a stale snapshot of an "unchanged" canvas.
  for (const c of [u, o]) { c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.fillStyle = 'rgba(0,0,0,0.004)'; c.fillRect(0, 0, 1, 1); c.restore(); }
  const Pst = S.post, R = S.ring;
  Pst.ca += 2.2 * impulses(t, HITS, 7) + 1.5 * eInExpo(P(t, 7.2, 8.0)) * (t < 8 ? 1 : 0);
  const fl = impulses(t, [8], 3.2) * 1.0 + impulses(t, [24], 5) * .55 + impulses(t, [20, 21, 22, 23], 12) * .35;
  Pst.flash = [1, .97, .94, Math.min(1, fl)];

  // GL: scene pass
  upload(texUnder, UC, false); upload(texOver, OC, true);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, W, H); gl.useProgram(PS);
  const M = rotMat(R.rx, R.ry, R.rz);
  gl.uniform2f(PS.u('uRes'), W, H);
  gl.uniformMatrix3fv(PS.u('uRot'), false, new Float32Array(M)); // row-major R read as column-major = R^T = local-from-world
  gl.uniform3f(PS.u('uPos'), R.x + sx / FPX * CAMZ, R.y - sy / FPX * CAMZ, R.z);
  gl.uniform1f(PS.u('uScale'), R.s);
  gl.uniform3fv(PS.u('uMetal'), R.metal); gl.uniform3fv(PS.u('uGlowCol'), R.glowCol);
  gl.uniform1f(PS.u('uGlow'), R.glow); gl.uniform1f(PS.u('uHalo'), R.halo); gl.uniform1f(PS.u('uVis'), R.vis); gl.uniform1f(PS.u('uEnv'), R.env);
  gl.uniform3fv(PS.u('uBgA'), S.bgA); gl.uniform3fv(PS.u('uBgB'), S.bgB); gl.uniform2fv(PS.u('uBgC'), S.bgC);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texUnder); gl.uniform1i(PS.u('uUnder'), 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindTexture(gl.TEXTURE_2D, texScene); gl.generateMipmap(gl.TEXTURE_2D);
  // post pass
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(PP);
  gl.uniform2f(PP.u('uRes'), W, H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texScene); gl.uniform1i(PP.u('uScene'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texOver); gl.uniform1i(PP.u('uOver'), 1);
  gl.uniform1f(PP.u('uCA'), Pst.ca); gl.uniform1f(PP.u('uGrain'), Pst.grain); gl.uniform1f(PP.u('uVig'), Pst.vig);
  gl.uniform1f(PP.u('uFade'), Pst.fade); gl.uniform1f(PP.u('uBloom'), Pst.bloom); gl.uniform1f(PP.u('uOverGlow'), Pst.overGlow);
  gl.uniform1f(PP.u('uSeed'), (t * 30) % 97); gl.uniform4fv(PP.u('uFlash'), Pst.flash);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);
}
window.renderFrame = renderFrame;
window.DURATION = DUR;

/* ---------- live playback (when opened in a browser) ---------- */
if (!/render/.test(location.search)) {
  document.body.classList.add('live');
  const audio = new Audio('halo-audio.m4a');
  let t0 = null;
  const loop = now => {
    const t = audio.src && !audio.paused ? audio.currentTime : t0 === null ? 0 : ((now - t0) / 1000) % DUR;
    renderFrame(Math.min(t, DUR - 1e-3)); requestAnimationFrame(loop);
  };
  document.getElementById('play').onclick = () => {
    document.getElementById('play').style.display = 'none';
    audio.loop = true; audio.play().catch(() => { t0 = performance.now(); });
    t0 = performance.now();
  };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
}
</script>
